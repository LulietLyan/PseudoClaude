# MCP Server configuration can live in either:
#   ~/.PseudoClaude/config.yaml
#   <project>/.PseudoClaude/config.yaml
#
# Project-level servers override user-level servers with the same name as a
# whole server definition. Only values in env and headers expand ${VAR}.

mcp_servers:
  github:
    type: stdio
    command: github-mcp-server
    args:
      - stdio
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}

  internal-api:
    type: http
    url: https://mcp.example.com/mcp
    headers:
      Authorization: Bearer ${MCP_HTTP_TOKEN}
      X-Client: PseudoClaude
